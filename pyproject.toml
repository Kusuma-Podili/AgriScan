[tool.poetry]
name = "agriscan"
version = "1.0.0"
description = "AgriScan Precision Agriculture & Autonomous Decision Intelligence Platform"
authors = ["Kusuma Podili <podilikusuma15@gmail.com>"]
license = "Proprietary"
readme = "README.md"
packages = [{include = "app", from = "backend"}]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = ">=0.110.0"
uvicorn = {extras = ["standard"], version = ">=0.28.0"}
pydantic = ">=2.6.0"
pydantic-settings = ">=2.2.0"
sqlalchemy = ">=2.0.28"
alembic = ">=1.13.1"
psycopg2-binary = ">=2.9.9"
redis = ">=5.0.3"
celery = ">=5.3.6"
python-jose = {extras = ["cryptography"], version = ">=3.3.0"}
passlib = {extras = ["bcrypt"], version = ">=1.7.4"}
python-multipart = ">=0.0.9"
numpy = ">=1.26.0"
pandas = ">=2.2.0"
scikit-learn = ">=1.4.0"
scipy = ">=1.12.0"
joblib = ">=1.3.2"
shap = ">=0.45.0"
requests = ">=2.31.0"
httpx = ">=0.27.0"
jinja2 = ">=3.1.3"
reportlab = ">=4.1.0"
python-dateutil = ">=2.9.0"
geojson = ">=3.1.0"
shapely = ">=2.0.3"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.1.0"
pytest-cov = ">=4.1.0"
pytest-asyncio = ">=0.23.5"
flake8 = ">=7.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
